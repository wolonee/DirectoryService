name: Directory Service CI

on:
  push:
    branches: [main]
    paths:
      - "backend/DirectoryService/**"
      - ".github/workflows/directory-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/DirectoryService/**"
      - ".github/workflows/directory-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: directory-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/DirectoryService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add private GitHub Packages source
        run: >-
          dotnet nuget add source
          "https://nuget.pkg.github.com/wolonee/index.json"
          --name github
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore DirectoryService.sln

      - name: Build
        run: dotnet build DirectoryService.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/DirectoryService.IntegrationTests/DirectoryService.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-service-test-results
          path: backend/DirectoryService/TestResults/*.trx
          if-no-files-found: warn
