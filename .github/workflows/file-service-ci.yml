name: File Service CI

on:
  push:
    branches: [main]
    paths:
      - "backend/FileService/**"
      - ".github/workflows/file-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/FileService/**"
      - ".github/workflows/file-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: file-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-pack:
    name: Build, test and pack
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/FileService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Add private GitHub Packages source
        run: >-
          dotnet nuget add source
          "https://nuget.pkg.github.com/wolonee/index.json"
          --name github
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text

      - name: Restore dependencies
        run: dotnet restore FileService.sln

      - name: Build
        run: dotnet build FileService.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test FileService.sln
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --results-directory TestResults

      - name: Pack Contracts
        run: >-
          dotnet pack src/FileService.Contracts/FileService.Contracts.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts

      - name: Pack Client
        run: >-
          dotnet pack src/FileService.Communications/FileService.Communications.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-service-test-results
          path: backend/FileService/TestResults/*.trx
          if-no-files-found: warn

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: file-service-nuget-packages
          path: backend/FileService/artifacts/*.nupkg
          if-no-files-found: error
