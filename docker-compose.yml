services:
  file-service:
    container_name: file-service
    build:
      context: ./backend
      dockerfile: FileService/Dockerfile
      args:
        NUGET_USERNAME: ${NUGET_USERNAME}
        NUGET_TOKEN: ${NUGET_TOKEN}
    ports:
      - "8003:8003"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: 8003
      S3Options__AccessKey: ${MINIO_ROOT_USER}
      S3Options__SecretKey: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8003/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: always

